# ── General ──────────────────────────────────────────────────────────────────

# Default shell
set-option -g default-shell /opt/homebrew/bin/fish

# Enable mouse for scrolling, pane selection, and resizing
set -g mouse on

# Terminal and true color support (needed for catppuccin to look right)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Allow terminal escape sequences to pass through (needed for image drag-and-drop, clipboard)
set -g allow-passthrough on

# Use system clipboard via OSC 52
set -g set-clipboard on

# Zero delay on escape key (eliminates lag when switching Vim modes)
set -sg escape-time 0

# Forward focus events to applications (needed for Neovim autoread, FocusGained, etc.)
set -g focus-events on

# Increase scrollback buffer (default is 2000)
set -g history-limit 50000

# Remap prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Keybindings ──────────────────────────────────────────────────────────────

# Reload config with prefix+r
unbind r
bind r source-file ~/.tmux.conf

# Intuitive splits: | for vertical, - for horizontal (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows open in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (also handled by vim-tmux-navigator plugin)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Display ──────────────────────────────────────────────────────────────────

# Start window and pane numbering at 1 (0 is too far from prefix key)
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Status bar at the top
set-option -g status-position top

# Highlight active pane border for easier navigation
# Use heavy Unicode box-drawing glyphs so borders read as thicker
# Inactive border color is set per-flavor in the theme-mode block below
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=blue,bold"


# ── Plugins ──────────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ── Catppuccin ───────────────────────────────────────────────────────────────

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Agent traffic lights after the window title (see .config/tmux/agents.conf)
set -g @catppuccin_window_text " #T#{P:#{E:@agents_dot}}"
set -g @catppuccin_window_current_text " #T#{P:#{E:@agents_dot}}"

# Status line modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@agents_status}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# ── Theme override (reads ~/.theme-mode before catppuccin loads) ─────────────

run-shell 'MODE=$(cat ~/.theme-mode 2>/dev/null || echo auto); \
  if [ "$MODE" = "light" ]; then FLAVOR="latte"; \
  elif [ "$MODE" = "dark" ]; then FLAVOR="mocha"; \
  else FLAVOR=$(defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark && echo mocha || echo latte); \
  fi; \
  tmux set -g @catppuccin_flavor "$FLAVOR"'

# ── TPM init (must be last) ──────────────────────────────────────────────────

run '~/.tmux/plugins/tpm/tpm'

# Agent traffic lights (needs the catppuccin theme options, so after TPM)
source-file ~/.config/tmux/agents.conf

# Override pane border color after catppuccin loads (plugin sets its own default).
# Use overlay2 from the active flavor so the border is visible on both backgrounds.
run-shell 'FLAVOR=$(tmux show -gv @catppuccin_flavor); \
  if [ "$FLAVOR" = "latte" ]; then BORDER="#7c7f93"; else BORDER="#9399b2"; fi; \
  tmux set -g pane-border-style "fg=$BORDER"'
