# vim:set ft=tmux:
#
# Agent traffic lights. `tmux-agents` (bin) writes @agent_state on each agent
# pane; this file renders it and binds the jump keys. Sourced after TPM so the
# catppuccin theme options exist.

# An agent pane is one that carries a state and has not dropped back to a shell.
set -g @agents_live "#{&&:#{@agent_state},#{!=:#{pane_current_command},fish}}"

# Window tabs get a bare dot per agent pane.
set -g @agents_dot "#{?#{E:@agents_live},#[range=user|#{pane_id}] #[fg=#{?#{==:#{@agent_state},blocked},#{@thm_red},#{?#{==:#{@agent_state},done},#{@thm_yellow},#{?#{==:#{@agent_state},working},#{@thm_green},#{@thm_overlay_1}}}}]●#[fg=#{@thm_fg}]#[norange],}"

# The status line groups agents per session in one connected catppuccin pill:
# a cap with the session name (mauve for the attached session), then per
# agent an icon on a cap in the state colour followed by its label, rounded
# only at the group ends. Claude writes its task into the pane title behind a
# "✳", which reads better than the session name, so the title wins when it
# has that glyph. Each agent is one click range, the session cap another.
# Every style is one attribute per bracket: a comma-separated #[fg=..,bg=..]
# breaks expansion when the values are formats.
set -g @agents_label "#{?#{m:✳ *,#{pane_title}},#{=/10/…:#{s/^✳ //:pane_title}},#{=/10/…:@agent_name}}"
set -g @agents_pill "#{?#{E:@agents_live},#[range=user|#{pane_id}]#[fg=#{@thm_crust}]#[bg=#{?#{==:#{@agent_state},blocked},#{@thm_red},#{?#{==:#{@agent_state},done},#{@thm_yellow},#{?#{==:#{@agent_state},working},#{@thm_green},#{@thm_overlay_1}}}}]󰚩 #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] #{E:@agents_label} #[norange],}"
set -g @agents_cap_colour "#{?#{==:#{session_name},#{client_session}},#{@thm_mauve},#{@thm_overlay_2}}"
set -g @agents_group "#[range=user|#{session_id}]#[bg=default]#[fg=#{E:@agents_cap_colour}]#{E:@catppuccin_status_left_separator}#[fg=#{@thm_crust}]#[bg=#{E:@agents_cap_colour}] #{session_name} #[norange]#{W:#{P:#{E:@agents_pill}}}#[fg=#{@thm_surface_0}]#[bg=default]#{E:@catppuccin_status_right_separator}"

# Every session that has an agent pane gets a group.
set -g @agents_sessions "#{S:#{?#{W:#{P:#{?@agent_state,1,}}},#{E:@agents_group},}}"

# The #() runs the reconcile on every status-interval and prints nothing; the
# segment hides itself when no agent is running anywhere.
set -g @agents_status "#(tmux-agents sync)#{?#{S:#{W:#{P:#{?@agent_state,1,}}}},#{E:@agents_sessions},}"

set -g status-interval 5

# tmux's default status-format[0] with one addition: a centred segment for the
# agents module, between the window list and the right-hand modules.
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=centre]#{E:@agents_status}#[norange default]#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# Jump: prefix+a picks from a menu, prefix+A goes to the next agent that
# needs you. Clicking an agent jumps to its pane, clicking a session cap
# switches to that session; anything else on the status line keeps tmux's
# default click-to-select-window.
bind a run-shell "tmux-agents menu"
bind A run-shell "tmux-agents next"
bind -T root MouseDown1Status if -F '#{m:*[%$]*,#{mouse_status_range}}' \
  { run-shell "tmux-agents jump '#{mouse_status_range}'" } \
  { select-window -t = }
