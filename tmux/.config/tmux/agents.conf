# vim:set ft=tmux:
#
# Agent traffic lights. `tmux-agents` (bin) writes @agent_state on each agent
# pane; this file renders it and binds the jump keys. Sourced after TPM so the
# catppuccin theme options exist.

# One dot per agent pane, clickable; the labelled form adds the agent name. Claude writes its task into
# the pane title behind a "✳", which reads better than the session name, so
# the title wins when it has that glyph. Hidden once the pane is back at a shell.
set -g @agents_label "#{?#{m:✳ *,#{pane_title}},#{=/10/…:#{s/^✳ //:pane_title}},#{=/10/…:@agent_name}}"
set -g @agents_dot "#{?#{&&:#{@agent_state},#{!=:#{pane_current_command},fish}},#[range=user|#{pane_id}] #[fg=#{?#{==:#{@agent_state},blocked},#{@thm_red},#{?#{==:#{@agent_state},done},#{@thm_yellow},#{?#{==:#{@agent_state},working},#{@thm_green},#{@thm_overlay_1}}}}]●#[fg=#{@thm_fg}]#[norange],}"
set -g @agents_dot_labelled "#{?#{&&:#{@agent_state},#{!=:#{pane_current_command},fish}},#[range=user|#{pane_id}] #[fg=#{?#{==:#{@agent_state},blocked},#{@thm_red},#{?#{==:#{@agent_state},done},#{@thm_yellow},#{?#{==:#{@agent_state},working},#{@thm_green},#{@thm_overlay_1}}}}]●#[fg=#{@thm_fg}]#{E:@agents_label}#[norange],}"

# Every session that has an agent pane, name plus its dots; current session bold.
set -g @agents_sessions "#{S:#{?#{W:#{P:#{?@agent_state,1,}}},#{?#{==:#{session_name},#{client_session}},#[bold],}#{session_name}#[nobold]#{W:#{P:#{E:@agents_dot_labelled}}} ,}}"

# Catppuccin status module. The #() runs the reconcile on every status-interval
# and prints nothing; the module hides itself when no agent is running anywhere.
%hidden MODULE_NAME="agents"
set -ogq "@catppuccin_agents_icon" "󰚩 "
set -ogqF "@catppuccin_agents_color" "#{E:@thm_mauve}"
set -ogq "@catppuccin_agents_text" " #{E:@agents_sessions}"
source -F "~/.tmux/plugins/tmux/utils/status_module.conf"
set -g @agents_status "#(tmux-agents sync)#{?#{S:#{W:#{P:#{?@agent_state,1,}}}},#{E:@catppuccin_status_agents},}"

set -g status-interval 5

# tmux's default status-format[0] with one addition: a centred segment for the
# agents module, between the window list and the right-hand modules.
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=centre]#{E:@agents_status}#[norange default]#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# Jump: prefix+a picks from a menu, prefix+A goes to the next agent that
# needs you. Clicking a dot jumps to its pane; anything else on the status
# line keeps tmux's default click-to-select-window.
bind a run-shell "tmux-agents menu"
bind A run-shell "tmux-agents next"
bind -T root MouseDown1Status if -F '#{m:*%*,#{mouse_status_range}}' \
  { run-shell "tmux-agents jump '#{mouse_status_range}'" } \
  { select-window -t = }
